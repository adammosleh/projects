<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المصمم - متجر العبايات</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
        }
        .design-part {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin: 0.25rem 0;
        }
        .customer-info {
            background: #f3f4f6;
            border-radius: 0.5rem;
            padding: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-purple-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-reverse space-x-4">
                    <div class="bg-purple-600 p-3 rounded-full">
                        <i class="fas fa-palette text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">لوحة تحكم المصمم</h1>
                        <p class="text-purple-200">إدارة طلبات التصميم المخصصة</p>
                    </div>
                </div>
                <div class="flex items-center space-x-reverse space-x-4">
                    <div class="text-left">
                        <p class="text-sm text-purple-200">المصمم</p>
                        <p class="font-semibold">أحمد المصمم</p>
                    </div>
                    <button onclick="refreshOrders()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sync-alt ml-2"></i>
                        تحديث
                    </button>
                    <button onclick="dashboard.logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt ml-2"></i>
                        تسجيل خروج
                    </button>
                    <a href="index.html" class="bg-purple-900 hover:bg-purple-800 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-home ml-2"></i>
                        المتجر
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">إجمالي الطلبات</p>
                        <p id="total-orders" class="text-2xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-blue-100 p-3 rounded-full">
                        <i class="fas fa-shopping-bag text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-yellow-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">قيد المراجعة</p>
                        <p id="pending-orders" class="text-2xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-yellow-100 p-3 rounded-full">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">موافق عليها</p>
                        <p id="approved-orders" class="text-2xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">مكتملة</p>
                        <p id="completed-orders" class="text-2xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <i class="fas fa-trophy text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="filterOrders('all')" class="filter-btn px-4 py-2 rounded-lg bg-purple-600 text-white" data-filter="all">
                        <i class="fas fa-list ml-2"></i>
                        جميع الطلبات
                    </button>
                    <button onclick="filterOrders('pending')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300" data-filter="pending">
                        <i class="fas fa-clock ml-2"></i>
                        قيد المراجعة
                    </button>
                    <button onclick="filterOrders('approved')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300" data-filter="approved">
                        <i class="fas fa-check ml-2"></i>
                        موافق عليها
                    </button>
                    <button onclick="filterOrders('completed')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300" data-filter="completed">
                        <i class="fas fa-trophy ml-2"></i>
                        مكتملة
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="text" id="search-input" placeholder="البحث برقم العميل أو الاسم..." 
                           class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                           onkeyup="searchOrders()">
                    <button onclick="searchOrders()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Orders Container -->
        <div id="orders-container" class="space-y-6">
            <!-- Orders will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <div class="bg-gray-100 rounded-full w-24 h-24 mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-inbox text-gray-400 text-4xl"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">لا توجد طلبات حالياً</h3>
            <p class="text-gray-500">سيتم عرض الطلبات الجديدة هنا عند وصولها</p>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div id="order-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-white border-b p-6 flex justify-between items-center">
                    <h3 class="text-2xl font-bold text-gray-800">تفاصيل الطلب</h3>
                    <button onclick="closeOrderModal()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <div id="order-details-content" class="p-6">
                    <!-- Order details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="designer-dashboard.js"></script>
</body>
</html>
