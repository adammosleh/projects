<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفواتير الصادرة - متجر العبايات</title>
    <meta name="theme-color" content="#8b5cf6">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="auth-system.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-lg sticky top-0 z-50 border-b-2 border-purple-100">
        <nav class="container mx-auto px-2 sm:px-4 py-2 sm:py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-reverse space-x-2 sm:space-x-4">
                    <div class="bg-purple-600 p-2 sm:p-3 rounded-full">
                        <i class="fas fa-store text-white text-lg sm:text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-sm sm:text-lg md:text-2xl font-bold text-gray-800">الفواتير الصادرة</h1>
                        <p class="text-xs sm:text-sm text-gray-600 hidden sm:block">عرض وإدارة جميع الفواتير</p>
                    </div>
                </div>
                <div class="flex items-center space-x-reverse space-x-2 sm:space-x-6">
                    <button onclick="window.location.href='index.html'" class="btn-secondary text-white px-2 sm:px-4 py-1 sm:py-2 rounded-lg flex items-center text-xs sm:text-sm ml-4">
                        <i class="fas fa-arrow-right ml-1 sm:ml-2"></i>
                        <span class="hidden sm:inline">الرئيسية</span>
                        <span class="sm:hidden">الرئيسية</span>
                    </button>
                    <button id="login-btn" class="btn-primary text-white px-2 sm:px-4 py-1 sm:py-2 rounded-lg flex items-center text-xs sm:text-sm">
                        <i class="fas fa-user ml-1 sm:ml-2"></i>
                        <span class="hidden sm:inline">تسجيل الدخول</span>
                        <span class="sm:hidden">دخول</span>
                    </button>
                    <button id="logout-btn" class="btn-secondary text-white px-2 sm:px-4 py-1 sm:py-2 rounded-lg flex items-center text-xs sm:text-sm hidden">
                        <i class="fas fa-sign-out-alt ml-1 sm:ml-2"></i>
                        <span class="hidden sm:inline">تسجيل الخروج</span>
                        <span class="sm:hidden">خروج</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-2 sm:px-4 py-4 sm:py-8">
        <div class="max-w-7xl mx-auto">
            <!-- Statistics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">إجمالي الفواتير</p>
                            <p class="text-2xl font-bold text-gray-800" id="total-invoices">0</p>
                        </div>
                        <div class="bg-purple-100 p-3 rounded-full">
                            <i class="fas fa-file-invoice text-purple-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">فواتير الشعارات</p>
                            <p class="text-2xl font-bold text-gray-800" id="logo-invoices">0</p>
                        </div>
                        <div class="bg-blue-100 p-3 rounded-full">
                            <i class="fas fa-tag text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">فواتير التصميم الكامل</p>
                            <p class="text-2xl font-bold text-gray-800" id="full-design-invoices">0</p>
                        </div>
                        <div class="bg-pink-100 p-3 rounded-full">
                            <i class="fas fa-palette text-pink-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">إجمالي الإيرادات</p>
                            <p class="text-2xl font-bold text-gray-800" id="total-revenue">0 ريال</p>
                        </div>
                        <div class="bg-green-100 p-3 rounded-full">
                            <i class="fas fa-money-bill-wave text-green-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters and Search -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">بحث عن العميل</label>
                        <input type="text" id="search-input" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="ابحث عن اسم العميل...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">نوع الفاتورة</label>
                        <select id="type-filter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <option value="">جميع الأنواع</option>
                            <option value="logo">فاتورة الشعارات</option>
                            <option value="full-design">فاتورة التصميم الكامل</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">من تاريخ</label>
                        <input type="date" id="date-from" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">إلى تاريخ</label>
                        <input type="date" id="date-to" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                </div>
                <div class="mt-4 flex gap-4">
                    <button onclick="applyFilters()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-filter ml-2"></i>
                        تطبيق الفلاتر
                    </button>
                    <button onclick="clearFilters()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                        <i class="fas fa-times ml-2"></i>
                        مسح الفلاتر
                    </button>
                    <button onclick="exportInvoices()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-download ml-2"></i>
                        تصدير Excel
                    </button>
                </div>
            </div>

            <!-- Invoices Table -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="p-6 border-b">
                    <h2 class="text-xl font-bold text-gray-800">قائمة الفواتير</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">رقم الفاتورة</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">تاريخ الإنشاء</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">العميل</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">النوع</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">المبلغ</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">الواصل</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">الباقي</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">الحالة</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="invoices-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Invoices will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="no-invoices" class="p-8 text-center text-gray-500 hidden">
                    <i class="fas fa-file-invoice text-4xl mb-4"></i>
                    <p>لا توجد فواتير حالياً</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <!-- <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 متجر العبايات الراقية. جميع الحقوق محفوظة</p>
        </div>
    </footer> -->
    
    <script src="issued-invoices.js"></script>
</body>
</html>
